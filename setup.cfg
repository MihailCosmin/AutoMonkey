[flake8]
# .venv/venv are the local virtualenvs (they live in the repo root, and flake8 would
# otherwise lint all of site-packages - 168 F821/F824/F822 hits from numpy, six, pywin32...
# on this box, while CI, which installs into its own interpreter, sees none of them).
exclude = docs,.venv,venv,build,dist,*.egg-info

[tool:pytest]
addopts = --ignore=setup.py